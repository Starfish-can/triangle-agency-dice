<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="agency-release" content="2026.09.18.1">
    <script>
        // 发布时，此版本号（上方 meta）与 version.js 必须一致。
        window.agencyPendingSends = 0;
        (() => {
            if (!/^https?:$/.test(location.protocol)) return;
            const currentRelease = document.querySelector('meta[name="agency-release"]').content;
            const directory = new URL('./', location.href);
            let checking = false;
            let lastCheck = 0;
            let navigating = false;
            async function checkForUpdate() {
                if (checking || navigating || document.visibilityState === 'hidden' || Date.now() - lastCheck < 15000) return;
                checking = true;
                lastCheck = Date.now();
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);
                try {
                    const versionUrl = new URL('version.js', directory);
                    versionUrl.searchParams.set('_check', String(Date.now()));
                    const response = await fetch(versionUrl, { cache: 'no-store', signal: controller.signal });
                    if (!response.ok) return;
                    const match = (await response.text()).match(/window\.AGENCY_SITE_RELEASE\s*=\s*["']([\w.-]+)["']/);
                    if (!match || match[1] === currentRelease) return;
                    const release = match[1];
                    // 同一次部署的 HTML 和版本文件均可用后才跳转。
                    const nextUrl = new URL('index.html', directory);
                    nextUrl.searchParams.set('v', release);
                    const probeUrl = new URL(nextUrl);
                    probeUrl.searchParams.set('_check', String(Date.now()));
                    const page = await fetch(probeUrl, { cache: 'no-store', signal: controller.signal });
                    if (!page.ok) return;
                    const remoteDocument = new DOMParser().parseFromString(await page.text(), 'text/html');
                    if (remoteDocument.querySelector('meta[name="agency-release"]')?.content !== release) return;
                    // 留待下一次检查，避免打断正在输入、解锁或上传的掷骰。
                    if (window.agencyPendingSends > 0 || document.querySelector('dialog[open]') ||
                        /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
                    const retryKey = 'agency_update_attempt:' + directory.pathname + ':' + release;
                    try {
                        const attempted = Number(sessionStorage.getItem(retryKey)) || 0;
                        if (Date.now() - attempted < 300000) return;
                        sessionStorage.setItem(retryKey, String(Date.now()));
                    } catch (_) { return; }
                    const destination = new URL(location.href);
                    destination.searchParams.set('v', release);
                    destination.searchParams.set('_refresh', String(Date.now()));
                    navigating = true;
                    location.replace(destination.href);
                } catch (_) {
                    // 离线或部署暂未完成时保留当前页面，下次检查重试。
                } finally {
                    clearTimeout(timeout);
                    checking = false;
                }
            }
            window.addEventListener('pageshow', checkForUpdate);
            window.addEventListener('focus', checkForUpdate);
            window.addEventListener('online', checkForUpdate);
            document.addEventListener('visibilitychange', checkForUpdate);
            setInterval(checkForUpdate, 60000);
            checkForUpdate();
        })();
    </script>

    <script>
        const SUPABASE_URL = "https://egtudzuaahkknlvfzgrb.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_beFak4osOEoXcoK668rFpA_t6Vki5Ol";

        let supabaseClient = null;
        let myName = "未命名特工";
        let isDarkMode = false;
        
        let myClientId = ""; 
        const STORAGE_KEY = "agency_dice_history_v20"; 
        const CLEAR_BEFORE_KEY = "agency_dice_clear_before_v20";
        const MAX_HISTORY = 40;
        const MAX_NAME_LENGTH = 40;
        let activeHistory = [];
        let historyLoaded = false;
        let realtimeSubscribed = false;
        let historyFailed = false;
        let realtimeFailed = false;
        const D6_UNLOCK_KEY = 'agency_d6_unlocked';
        const D6_ENABLED_KEY = 'agency_d6_enabled';
        let d6Unlocked = false;

        function updateAnomalyControls() {
            const isAnomaly = document.querySelector('input[name="roll-type"]:checked').value === 'anomaly';
            document.getElementById('anomaly-controls').hidden = !isAnomaly;
            document.getElementById('anomaly-unlock').hidden = d6Unlocked;
            document.getElementById('d6-toggle').hidden = !d6Unlocked;
            document.getElementById('use-d6').disabled = !isAnomaly || !d6Unlocked;
            if (!isAnomaly) document.getElementById('anomaly-dialog').close();
        }

        function openAnomalyDialog() {
            if (document.querySelector('input[name="roll-type"]:checked').value !== 'anomaly') return;
            document.getElementById('anomaly-answer').value = '';
            document.getElementById('anomaly-error').hidden = true;
            document.getElementById('anomaly-dialog').showModal();
            document.getElementById('anomaly-answer').focus();
        }

        function unlockAnomaly(event) {
            event.preventDefault();
            if (document.querySelector('input[name="roll-type"]:checked').value !== 'anomaly') return;
            const answer = document.getElementById('anomaly-answer');
            if (!/^#?u0047bb$/i.test(answer.value.trim())) {
                document.getElementById('anomaly-error').hidden = false;
                answer.focus();
                return;
            }
            d6Unlocked = true;
            localStorage.setItem(D6_UNLOCK_KEY, 'true');
            document.getElementById('anomaly-dialog').close();
            updateAnomalyControls();
            document.getElementById('use-d6').focus();
        }

        function saveD6Preference() {
            localStorage.setItem(D6_ENABLED_KEY, String(document.getElementById('use-d6').checked));
        }

        function calculateRoll(rolls, burnout, d6 = null) {
            const d4Threes = rolls.filter(value => value === 3).length;
            const countOfThree = d4Threes + (d6 === 3 ? 1 : d6 === 6 ? 2 : 0);
            const naturalThrees = d4Threes + (d6 === 3 ? 1 : 0);
            const isThreefold = countOfThree === 3;
            const netResult = countOfThree - burnout;
            return {
                countOfThree, naturalThrees, isThreefold, netResult,
                isSuccess: isThreefold || netResult >= 1,
                isUnleash: countOfThree === 7,
                chaos: isThreefold ? 0 : 6 - d4Threes + (d6 !== null && d6 !== 3 && d6 !== 6 ? 1 : 0) + burnout
            };
        }

        function setSyncStatus(state, message) {
            const statusTag = document.getElementById('status-tag');
            if (!statusTag) return;
            const classes = {
                connecting: "text-xs px-2 py-1 bg-amber-500/10 text-amber-600 border border-amber-500/30 rounded font-bold uppercase",
                online: "text-xs px-2 py-1 bg-green-500/10 text-green-600 border border-green-500/30 rounded font-bold uppercase",
                error: "text-xs px-2 py-1 bg-red-500/10 text-red-600 border border-red-500/30 rounded font-bold uppercase"
            };
            statusTag.className = classes[state];
            statusTag.innerText = message;
        }

        function refreshSyncStatus() {
            if (historyFailed) {
                setSyncStatus('error', 'SYNC ERROR // 历史读取失败');
                return;
            }
            if (realtimeFailed) {
                setSyncStatus('error', 'SYNC ERROR // 实时连接失败');
                return;
            }
            if (historyLoaded && realtimeSubscribed) {
                setSyncStatus('online', 'ONLINE // 中枢已同步');
            } else {
                setSyncStatus('connecting', 'CONNECTING // 网关连接中');
            }
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>'\"]/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            })[character]);
        }

        function getRollTime(data) {
            const match = typeof data?.id === 'string' && data.id.match(/^roll_(\d+)_/);
            return match ? Number(match[1]) : 0;
        }

        function normalizeRoll(data) {
            if (!data || typeof data !== 'object' || typeof data.id !== 'string' || data.id.length > 100 ||
                typeof data.sender !== 'string' || data.sender.trim().length === 0 || data.sender.length > MAX_NAME_LENGTH ||
                !Array.isArray(data.rolls) || data.rolls.length !== 6 ||
                !data.rolls.every(value => Number.isInteger(value) && value >= 1 && value <= 4) ||
                !['reality', 'anomaly'].includes(data.rollType) || !Number.isInteger(data.burnout) ||
                data.burnout < 0 || data.burnout > 6) return null;

            const d6 = data.d6 ?? null;
            if (d6 !== null && (data.rollType !== 'anomaly' || !Number.isInteger(d6) || d6 < 1 || d6 > 6)) return null;
            return {
                id: data.id,
                clientId: typeof data.clientId === 'string' && data.clientId.length <= 100 ? data.clientId : null,
                sender: data.sender.trim(),
                rolls: data.rolls,
                rollType: data.rollType,
                d6,
                burnout: data.burnout,
                ...calculateRoll(data.rolls, data.burnout, d6),
                isSecret: data.isSecret === true,
                timestamp: typeof data.timestamp === 'string' ? data.timestamp.slice(0, 30) : ''
            };
        }

        function toggleTheme() {
            const body = document.getElementById('main-body');
            const themeBtn = document.getElementById('theme-btn');
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
                body.className = "agency-bg-dark text-gray-100 min-h-screen flex flex-col font-mono selection:bg-red-600 selection:text-white transition-colors duration-350 dark";
                themeBtn.innerText = "🌙 护眼暗色终端";
                localStorage.setItem('agency_theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                body.className = "agency-bg-light text-neutral-900 min-h-screen flex flex-col font-mono selection:bg-red-600 selection:text-white transition-colors duration-350";
                themeBtn.innerText = "☀ 亮色特工终端";
                localStorage.setItem('agency_theme', 'light');
            }
        }

        function initClientId() {
            const savedId = localStorage.getItem('agency_client_id');
            if (savedId) {
                myClientId = savedId;
            } else {
                myClientId = 'agent_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('agency_client_id', myClientId);
            }
        }

        function syncHistoryFromStorage() {
            const savedHistory = localStorage.getItem(STORAGE_KEY);
            if (savedHistory) {
                try {
                    const clearBefore = Number(localStorage.getItem(CLEAR_BEFORE_KEY)) || 0;
                    const parsed = JSON.parse(savedHistory);
                    activeHistory = Array.isArray(parsed)
                        ? parsed.map(normalizeRoll).filter(roll => roll && getRollTime(roll) >= clearBefore).slice(0, MAX_HISTORY)
                        : [];
                } catch(e) { activeHistory = []; }
            } else {
                activeHistory = [];
            }
        }

        window.onload = function() {
            initClientId();
            const savedTheme = localStorage.getItem('agency_theme');
            if (savedTheme === 'dark') { toggleTheme(); }
            const savedName = localStorage.getItem('agency_nick');
            if (savedName && savedName.trim() !== "") {
                myName = savedName.trim().slice(0, MAX_NAME_LENGTH);
                document.getElementById('username').value = myName;
            }
            const savedBurnout = localStorage.getItem('agency_burnout');
            if (savedBurnout !== null) {
                document.getElementById('burnout-value').value = savedBurnout;
            }
            d6Unlocked = localStorage.getItem(D6_UNLOCK_KEY) === 'true';
            document.getElementById('use-d6').checked = d6Unlocked && localStorage.getItem(D6_ENABLED_KEY) === 'true';
            document.querySelectorAll('input[name="roll-type"]').forEach(input => input.addEventListener('change', updateAnomalyControls));
            updateAnomalyControls();
            syncHistoryFromStorage();
            renderAllLogs();
            initSupabaseSync();

            window.addEventListener('storage', (e) => {
                if (e.key === STORAGE_KEY) {
                    renderAllLogs();
                }
            });
        };

        function saveName() {
            const input = document.getElementById('username');
            const nameInput = input.value.trim().slice(0, MAX_NAME_LENGTH);
            input.value = nameInput;
            myName = nameInput || "未命名特工";
            localStorage.setItem('agency_nick', myName);
            renderAllLogs();
        }

        function saveBurnout() {
            const input = document.getElementById('burnout-value');
            let burnoutInput = Number(input.value);
            const burnout = Number.isInteger(burnoutInput) ? Math.min(6, Math.max(0, burnoutInput)) : 0;
            input.value = burnout;
            localStorage.setItem('agency_burnout', burnout);
        }

        function initSupabaseSync() {
            try {
                if (!window.supabase) throw new Error('Supabase SDK 未加载');
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                fetchRecentHistory();
                supabaseClient
                    .channel('public:agency_rolls')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'agency_rolls' }, payload => {
                        if (payload.new && payload.new.payload) {
                            handleIncomingRoll(payload.new.payload);
                        }
                    })
                    .subscribe((status) => {
                        if (status === 'SUBSCRIBED') {
                            realtimeSubscribed = true;
                            realtimeFailed = false;
                            refreshSyncStatus();
                        } else if (['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(status)) {
                            realtimeSubscribed = false;
                            realtimeFailed = true;
                            refreshSyncStatus();
                            appendSystemLog(`Supabase 实时连接异常：${status}`);
                        }
                    });
            } catch (e) {
                console.error(e);
                setSyncStatus('error', 'SYNC ERROR // 网关不可用');
                appendSystemLog("Supabase 网关初始化失败，请检查配置凭证。");
            }
        }

        async function fetchRecentHistory() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient
                    .from('agency_rolls')
                    .select('payload')
                    .order('created_at', { ascending: false })
                    .limit(MAX_HISTORY);
                if (error) throw error;
                
                if (data && data.length > 0) {
                    let hasNew = false;
                    const clearBefore = Number(localStorage.getItem(CLEAR_BEFORE_KEY)) || 0;
                    data.forEach(row => {
                        const roll = normalizeRoll(row.payload);
                        if (roll && !roll.isSecret && getRollTime(roll) >= clearBefore && !activeHistory.some(item => item.id === roll.id)) {
                            activeHistory.push(roll);
                            hasNew = true;
                        }
                    });
                    if (hasNew) {
                        activeHistory.sort((a, b) => {
                            const timeA = parseInt(a.id.split('_')[1]) || 0;
                            const timeB = parseInt(b.id.split('_')[1]) || 0;
                            return timeB - timeA;
                        });
                        if (activeHistory.length > MAX_HISTORY) activeHistory = activeHistory.slice(0, MAX_HISTORY);
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(activeHistory));
                        renderAllLogs();
                    }
                }
                historyLoaded = true;
                historyFailed = false;
                refreshSyncStatus();
            } catch (err) {
                console.error('历史读取失败:', err);
                historyFailed = true;
                refreshSyncStatus();
                appendSystemLog('无法读取云端历史记录；新的掷骰仍会尝试同步。');
            }
        }

        async function broadcastRoll(rollData) {
            if (!supabaseClient) return;
            window.agencyPendingSends = (window.agencyPendingSends || 0) + 1;
            try {
                const { error } = await supabaseClient
                    .from('agency_rolls')
                    .insert([{ id: rollData.id, payload: rollData }]);
                if (error) throw error;
                refreshSyncStatus();
            } catch (error) {
                console.error("广播失败:", error);
                setSyncStatus('error', 'SYNC ERROR // 本次未同步');
                appendSystemLog('本次掷骰仅保存在本地，未能同步给其他玩家。');
            } finally {
                window.agencyPendingSends--;
            }
        }

        function rollAgencyDice() {
            const burnoutInput = Number(document.getElementById('burnout-value').value);
            const burnout = Number.isInteger(burnoutInput) ? Math.min(6, Math.max(0, burnoutInput)) : 0;
            document.getElementById('burnout-value').value = burnout;
            localStorage.setItem('agency_burnout', burnout);
            const rollType = document.querySelector('input[name="roll-type"]:checked').value;
            const rolls = [];
            for (let i = 0; i < 6; i++) {
                const val = Math.floor(Math.random() * 4) + 1;
                rolls.push(val);
            }
            const useD6 = rollType === 'anomaly' && d6Unlocked && document.getElementById('use-d6').checked;
            const d6 = useD6 ? Math.floor(Math.random() * 6) + 1 : null;
            const rollData = {
                id: "roll_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
                clientId: myClientId, 
                sender: myName,
                rolls: rolls,
                rollType: rollType, 
                d6,
                burnout: burnout,
                ...calculateRoll(rolls, burnout, d6),
                isSecret: document.getElementById('is-secret').checked,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
            };
            pushToLocalHistory(rollData);
            if (!rollData.isSecret) {
                broadcastRoll(rollData);
            }
        }

        function handleIncomingRoll(data) {
            const roll = normalizeRoll(data);
            const clearBefore = Number(localStorage.getItem(CLEAR_BEFORE_KEY)) || 0;
            if (!roll || roll.isSecret || getRollTime(roll) < clearBefore) return;
            pushToLocalHistory(roll);
        }

        function pushToLocalHistory(data) {
            const roll = normalizeRoll(data);
            if (!roll) return;
            syncHistoryFromStorage();
            if (!activeHistory.some(item => item.id === roll.id)) {
                activeHistory.unshift(roll);
                if (activeHistory.length > MAX_HISTORY) activeHistory.pop();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(activeHistory));
                renderAllLogs();
            }
        }

        function renderAllLogs() {
            const container = document.getElementById('log-container');
            if (!container) return;
            syncHistoryFromStorage();
            if (activeHistory.length === 0) {
                container.innerHTML = '<div id="empty-state-msg" class="text-neutral-400 dark:text-neutral-650 text-center text-sm py-12">终端空闲，等待干涉下达...</div>';
                return;
            }
            container.innerHTML = '';
            activeHistory.forEach(data => {
                const isSelf = data.clientId === myClientId;
                const element = createRollElement(data, isSelf);
                container.appendChild(element); 
            });
        }

        function createRollElement(data, isSelf) {
            const div = document.createElement('div');
            const isRed = (data.rollType === 'reality');
            let cardStyle = "";
            let diceClass = "";
            if (isRed) {
                cardStyle = data.isSuccess ? "border-red-400/80 bg-red-50/40 dark:border-red-950/50 dark:bg-red-950/10" : "border-neutral-300 dark:border-neutral-900 bg-neutral-50 dark:bg-neutral-950/50";
                if (data.isThreefold) cardStyle = "border-red-600 bg-red-50/90 dark:border-red-500/50 dark:bg-red-950/30 shadow-[4px_4px_0px_0px_#dc2626] dark:shadow-none";
                diceClass = "triangle-dice-red";
            } else {
                cardStyle = data.isSuccess ? "border-blue-400/80 bg-blue-50/40 dark:border-blue-950/50 dark:bg-blue-950/10" : "border-neutral-300 dark:border-neutral-900 bg-neutral-50 dark:bg-neutral-950/50";
                if (data.isThreefold) cardStyle = "border-blue-600 bg-blue-50/90 dark:border-blue-500/50 dark:bg-blue-950/30 shadow-[4px_4px_0px_0px_#2563eb] dark:shadow-none";
                diceClass = "triangle-dice-blue";
            }
            div.className = `p-4 rounded border-2 ${cardStyle} flex flex-col gap-3 text-sm transition-colors duration-250`;
            if (data.isUnleash) div.classList.add('unleash-card', 'blue-fluid');
            let tag = isSelf ? `<span class="text-[10px] bg-neutral-900 dark:bg-white/10 text-white px-1.5 py-0.5 rounded font-bold tracking-widest">YOU</span>` : "";
            const labelText = isRed ? "现实改写 // ASK THE AGENCY" : "异常能力 // ANOMALY ABILITY";
            const labelColor = isRed ? "text-red-600 dark:text-red-400" : "text-blue-600 dark:text-blue-400";
            let diceHtml = `<div class="flex flex-wrap items-end gap-4 my-1.5">`;
            data.rolls.forEach(val => { diceHtml += `<div class="${diceClass}"><span class="triangle-text">${val}</span></div>`; });
            if (data.d6 != null) diceHtml += `<div class="square-dice-blue" aria-label="六面骰：${data.d6}">${data.d6}</div>`;
            diceHtml += `</div>`;
            let statusBadge = "";
            if (data.isUnleash) {
                statusBadge = `<div class="unleash-badge blue-fluid mt-2 text-center py-2.5 rounded font-black text-sm">UNL3ASH</div>`;
            } else if (data.isThreefold) {
                const sublimationBg = isRed ? "bg-red-600 dark:bg-red-950 border-red-700 dark:border-red-500 text-white dark:text-red-300" : "bg-blue-600 dark:bg-blue-950 border-blue-700 dark:border-blue-500 text-white dark:text-blue-300";
                statusBadge = `<div class="mt-2 text-center py-2.5 ${sublimationBg} border rounded font-black text-xs tracking-widest">▲▲▲ 三重升华 // TRISENDENCE ▲▲▲</div>`;
            } else if (data.isSuccess) {
                const successBg = isRed ? "bg-red-100 dark:bg-red-950/20 border-red-300 dark:border-red-900/40 text-red-650" : "bg-blue-100 dark:bg-blue-950/20 border-blue-300 dark:border-blue-900/40 text-blue-650";
                statusBadge = `<div class="mt-2 text-center py-1 ${successBg} dark:text-neutral-300 border rounded text-xs font-black tracking-widest">▼ 判定成功 // SUCCESS</div>`;
            } else {
                statusBadge = `<div class="mt-2 text-center py-1 bg-neutral-100 dark:bg-neutral-900 border border-neutral-300 dark:border-neutral-800 rounded text-neutral-500 text-xs font-black tracking-widest">▲ 判定失败 // FAILURE</div>`;
            }
            div.innerHTML = `
                <div class="flex justify-between items-center text-xs text-neutral-500">
                    <span class="font-black flex items-center gap-2 uppercase text-neutral-800 dark:text-neutral-300 tracking-wider">${escapeHtml(data.sender)} ${tag}</span>
                    <span class="font-bold ${labelColor}">${labelText}</span>
                </div>
                ${diceHtml}
                <div class="bg-white/80 dark:bg-black/40 p-2.5 rounded border border-neutral-200 dark:border-neutral-900/50 text-xs text-neutral-600 dark:text-neutral-400 mt-1 flex flex-wrap gap-2 justify-between items-center transition-colors">
                    <div>检测到 “3” 的数量：<span class="${isRed ? 'text-red-600 dark:text-red-500' : 'text-blue-600 dark:text-blue-500'} font-black">${data.countOfThree}</span> / 产生混沌值：<span class="text-blue-600 dark:text-blue-400 font-black">${data.chaos}</span></div>
                    <div class="text-right">净判定：<span class="${data.netResult >= 1 ? (isRed ? 'text-red-600 dark:text-red-500' : 'text-blue-600 dark:text-blue-500') : 'text-neutral-500'} font-black text-sm">${data.netResult >= 0 ? '+' + data.netResult : data.netResult}</span></div>
                </div>
                ${statusBadge}
            `;
            return div;
        }

        function appendSystemLog(text) {
            const container = document.getElementById('log-container');
            const emptyMsg = document.getElementById('empty-state-msg');
            if (emptyMsg) emptyMsg.remove();
            const div = document.createElement('div');
            div.className = "text-center text-[10px] text-red-700/80 dark:text-red-500/60 py-1.5 bg-red-100/10 dark:bg-red-950/5 rounded border border-red-300/40 dark:border-red-900/10";
            div.innerText = `▲ SYS_LOG: ${text}`;
            container.insertBefore(div, container.firstChild);
        }

        function clearAllLogs() {
            activeHistory = [];
            localStorage.setItem(CLEAR_BEFORE_KEY, String(Date.now()));
            localStorage.removeItem(STORAGE_KEY);
            renderAllLogs();
            appendSystemLog("本地历史记录已全部清空，终端格式化完成。");
        }
    </script>
</body>
</html>
